name: Verbatim Bench

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider (groq, openrouter, ... or 'all' for every configured key)"
        default: "groq"
      models:
        description: "Comma-separated models (empty = provider defaults)"
        default: ""
      all_models:
        description: "Test every chat model (true/false)"
        default: "false"
      all_langs:
        description: "Test all Handy languages (true/false)"
        default: "false"
  schedule:
    # Weekly on Monday 06:00 UTC. Remove this block if you only want manual runs.
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Key check + benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          ARGS="--concurrency 1 --retries 5 --yes"
          if [ "${{ inputs.provider }}" = "all" ]; then
            ARGS="$ARGS --all-providers"
          else
            ARGS="$ARGS --provider ${{ inputs.provider || 'groq' }}"
          fi
          if [ -n "${{ inputs.models }}" ]; then
            ARGS="$ARGS --models ${{ inputs.models }}"
          fi
          if [ "${{ inputs.all_models }}" = "true" ]; then
            ARGS="$ARGS --all"
          fi
          if [ "${{ inputs.all_langs }}" = "true" ]; then
            ARGS="$ARGS --all-langs"
          fi
          node bench.mjs $ARGS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verbatim-bench-results
          path: |
            results.json
            results.md
            chart-*.svg

      - name: Commit fresh charts
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart-*.svg models-known.json
          git diff --staged --quiet || git commit -m "chore: refresh benchmark charts"
          git push
